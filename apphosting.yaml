# Firebase App Hosting config. Safe to commit: secrets are references to Cloud Secret Manager.
# Setup steps: see DEPLOY.md.

runConfig:
  minInstances: 0 # scale to zero when idle; set 1 to avoid cold starts once you have traffic
  maxInstances: 10
  concurrency: 80

env:
  # Public site URL, used for Stripe success/cancel redirects. Change to your custom domain later.
  - variable: SITE_URL
    value: https://REPLACE-WITH-YOUR-BACKEND-URL.hosted.app
    availability: [RUNTIME]

  # Stripe (create with: firebase apphosting:secrets:set STRIPE_SECRET_KEY)
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability: [RUNTIME]
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability: [RUNTIME]

  # Uncomment to allow unpaid "demo" orders in production (only if you have no Stripe account yet).
  # - variable: CHECKOUT_DEMO_MODE
  #   value: "true"
  #   availability: [RUNTIME]

# Not needed here:
#  - NEXT_PUBLIC_FIREBASE_*: App Hosting injects FIREBASE_WEBAPP_CONFIG at build time and
#    next.config.ts maps it to these names.
#  - Service-account keys: the backend's service account has Admin SDK access (ADC).
