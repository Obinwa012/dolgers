# Firebase App Hosting configuration for the DOLGERS import-system admin
# (this folder is the backend's root directory).
#
# ADMIN_PASSWORD_HASH: scrypt hash of the admin password (one-way; safe to commit).
# To rotate the password: generate a new hash and update this value, then redeploy.
# Sessions are server-side docs in the `sessions` collection (no signing secret needed).
#
# REQUIRED IAM (one-time, Firebase/GCP console): grant the App Hosting compute
# service account roles/datastore.user on the dolgers project, otherwise the
# admin app can read Firestore but not write staging/jobs/config docs.
runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: SITE_URL
    value: https://dolgers--dolgers.us-central1.hosted.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://dolgers--dolgers.us-central1.hosted.app
    availability: [BUILD, RUNTIME]

  # Admin login. Hash of the password issued to Michael 2026-10-06 (single admin).
  - variable: ADMIN_PASSWORD_HASH
    value: scrypt$16384$b50ca826834a66016707b2a66151938d$e9be2ba85554c45651ff59df32bffd94b2985551199e0e1f525aa784432e16b5
    availability: [RUNTIME]
