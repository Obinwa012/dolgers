# Firebase App Hosting configuration for the DOLGERS import-system admin
# (this folder is the backend's root directory).
#
# Auth: Firebase Authentication (email/password provider). Admins are tracked
# in the Firestore `users` collection: users/{uid} = { email, admin }.
# The first login auto-promotes to admin (bootstrap); after that only docs
# with admin=true can sign in.
# Sessions are server-side docs in the `sessions` collection.
runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: SITE_URL
    value: https://dolgers--dolgers.us-central1.hosted.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://dolgers--dolgers.us-central1.hosted.app
    availability: [BUILD, RUNTIME]
